<svg width="404" height="226" viewBox="0 0 404 226" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="404" height="226" rx="8" fill="#FFF3E0" />
  <!-- Central System Network Graphic -->
  <g transform="translate(102, 23)">
    <!-- Outer Connecting Ring -->
    <circle cx="100" cy="90" r="70" stroke="#E8800A" stroke-width="2" stroke-dasharray="6 4" opacity="0.4" />
    
    <!-- Central Node: System Core -->
    <circle cx="100" cy="90" r="28" fill="#E8800A" />
    <text x="100" y="94" font-family="'DM Sans', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">SYSTEM</text>
    
    <!-- Node 1: Advertising -->
    <line x1="100" y1="90" x2="40" y2="40" stroke="#E8800A" stroke-width="2" />
    <circle cx="40" cy="40" r="22" fill="#1C182B" />
    <text x="40" y="44" font-family="'DM Sans', sans-serif" font-weight="600" font-size="10" fill="#FFFFFF" text-anchor="middle">ADS</text>

    <!-- Node 2: Conversion -->
    <line x1="100" y1="90" x2="160" y2="40" stroke="#E8800A" stroke-width="2" />
    <circle cx="160" cy="40" r="22" fill="#1C182B" />
    <text x="160" y="44" font-family="'DM Sans', sans-serif" font-weight="600" font-size="10" fill="#FFFFFF" text-anchor="middle">LISTINGS</text>

    <!-- Node 3: Organic Rank -->
    <line x1="100" y1="90" x2="100" y2="155" stroke="#E8800A" stroke-width="2" />
    <circle cx="100" cy="155" r="22" fill="#1C182B" />
    <text x="100" y="159" font-family="'DM Sans', sans-serif" font-weight="600" font-size="10" fill="#FFFFFF" text-anchor="middle">RANKING</text>
  </g>
</svg>
